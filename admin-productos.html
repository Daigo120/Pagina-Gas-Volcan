<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gas El Volcán - Admin Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand fw-bold text-warning" href="admin.html"> Mantenedor de Productos</a>
                <a href="admin.html" class="btn btn-outline-light btn-sm">Volver al Panel</a>
            </div>
        </nav>
    </header>

    <main class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3>Catálogo Actual</h3>
            <button class="btn btn-success fw-bold">+ Nuevo Producto</button>
        </div>

        <table class="table table-bordered table-striped shadow-sm">
            <thead class="table-dark">
                <tr>
                    <th>Código</th>
                    <th>Categoría</th>
                    <th>Producto</th>
                    <th>Precio Residencial</th>
                    <th>Stock</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tabla-admin-productos">
                
            </tbody>
        </table>
    </main>

    <script src="js/datos.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const tbody = document.getElementById("tabla-admin-productos");

       
        function renderizarTabla() {
            tbody.innerHTML = "";
            productosGas.forEach((p, index) => {
                tbody.innerHTML += `
                    <tr>
                        <td>${p.codigo}</td>
                        <td>${p.categoria}</td>
                        <td><strong>${p.nombre}</strong></td>
                        <td>$${p.precioResidencial.toLocaleString("es-CL")}</td>
                        <td>
                            <div class="d-flex align-items-center gap-2">
                                <button class="btn btn-outline-secondary btn-sm fw-bold" onclick="modificarStock(${index}, -1)">-</button>
                                <span class="fw-bold">${p.stock}</span>
                                <button class="btn btn-outline-secondary btn-sm fw-bold" onclick="modificarStock(${index}, 1)">+</button>
                            </div>
                        </td>
                        <td>
                            <button class="btn btn-primary btn-sm me-1" onclick="editarProducto(${index})">Editar</button>
                            <button class="btn btn-danger btn-sm" onclick="eliminarProducto(${index})">Eliminar</button>
                        </td>
                    </tr>
                `;
            });
        }

        
        window.modificarStock = (index, cambio) => {
            if (productosGas[index].stock + cambio >= 0) {
                productosGas[index].stock += cambio;
                renderizarTabla();
            }
        };

       
        window.editarProducto = (index) => {
            const prod = productosGas[index];
            const nuevoNombre = prompt("Nuevo nombre del producto:", prod.nombre);
            const nuevoPrecio = prompt("Nuevo precio residencial:", prod.precioResidencial);

            if (nuevoNombre !== null && nuevoNombre.trim() !== "") {
                prod.nombre = nuevoNombre.trim();
            }
            if (nuevoPrecio !== null && !isNaN(nuevoPrecio) && nuevoPrecio > 0) {
                prod.precioResidencial = Number(nuevoPrecio);
            }
            renderizarTabla();
        };

       
        window.eliminarProducto = (index) => {
            if (confirm(`¿Estás seguro de eliminar el producto "${productosGas[index].nombre}"?`)) {
                productosGas.splice(index, 1);
                renderizarTabla();
            }
        };

        
        const btnNuevo = document.querySelector(".btn-success");
        if (btnNuevo) {
            btnNuevo.addEventListener("click", () => {
                const codigo = prompt("Ingrese Código (Ej: G15):");
                const categoria = prompt("Ingrese Categoría (Ej: Cilindros):");
                const nombre = prompt("Ingrese Nombre del Producto:");
                const precio = prompt("Ingrese Precio Residencial:");
                const stock = prompt("Ingrese Stock Inicial:");

                if (codigo && categoria && nombre && !isNaN(precio) && !isNaN(stock)) {
                    productosGas.push({
                        codigo: codigo.toUpperCase(),
                        categoria: categoria,
                        nombre: nombre,
                        precioResidencial: Number(precio),
                        stock: Number(stock)
                    });
                    renderizarTabla();
                } else {
                    alert("Datos inválidos o incompletos.");
                }
            });
        }

        renderizarTabla();
    });
</script>
</body>
</html>
