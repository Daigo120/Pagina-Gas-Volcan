<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gas El Volcán - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h3 class="fw-bold text-center mb-4">Iniciar Sesión</h3>
                        <form id="form-login">
                            <div class="mb-3">
                                <label for="correo" class="form-label">Correo Electrónico</label>
                                <input type="email" id="correo" class="form-control" placeholder="ejemplo@correo.cl">
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Contraseña</label>
                                <input type="password" id="password" class="form-control" placeholder="****">
                            </div>
                            <div id="errores-login" class="error-message mb-3"></div>
                            <button type="submit" class="btn btn-warning w-100 fw-bold">Entrar</button>
                        </form>
                        <div class="text-center mt-3">
                            <a href="index.html" class="text-secondary small">Volver al Inicio</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/validaciones.js"></script>
    <script>
        document.getElementById("form-login").addEventListener("submit", function(e) {
            e.preventDefault();
            const correo = document.getElementById("correo").value;
            const password = document.getElementById("password").value;
            const divErrores = document.getElementById("errores-login");

            const errores = validarLogin(correo, password);
            if (errores.length > 0) {
            divErrores.innerHTML = errores.join("<br>");
            } else {
                divErrores.innerHTML = "";
        
       
                if (correo === "admin@gmail.com" && password === "1234") {
                    alert("¡Bienvenido Administrador!");
                    window.location.href = "admin.html";
                } else {
                    alert("¡Inicio de sesión exitoso!");
                    window.location.href = "index.html"; 
        }
    }
});
    </script>
</body>
</html>
