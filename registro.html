<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gas El Volcán - Registro de Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-7">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h3 class="fw-bold mb-4 text-center">Registro de Usuario</h3>
                        <form id="form-registro">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">RUN (sin puntos ni guion)</label>
                                    <input type="text" id="run" class="form-control" placeholder="12345678K">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Nombre</label>
                                    <input type="text" id="nombre" class="form-control">
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Apellidos</label>
                                    <input type="text" id="apellidos" class="form-control">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Correo Electrónico</label>
                                    <input type="email" id="correo" class="form-control">
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Contraseña (4-10 caracteres)</label>
                                    <input type="password" id="password" class="form-control">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Tipo de Usuario</label>
                                    <select id="tipoUsuario" class="form-select">
                                        <option value="">Seleccione...</option>
                                        <option value="residencial">Residencial</option>
                                        <option value="comercial">Comercial</option>
                                    </select>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Región</label>
                                    <select id="select-region" class="form-select">
                                        <option value="">Seleccione Región</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Comuna</label>
                                    <select id="select-comuna" class="form-select">
                                        <option value="">Seleccione Comuna</option>
                                    </select>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Dirección Completa</label>
                                <input type="text" id="direccion" class="form-control" placeholder="Calle, número, depto">
                            </div>

                            <div id="errores-registro" class="error-message mb-3"></div>

                            <button type="submit" class="btn btn-warning w-100 fw-bold">Registrarse</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/datos.js"></script>
    <script src="js/validaciones.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.getElementById("form-registro").addEventListener("submit", function(e) {
            e.preventDefault();
            const datos = {
                run: document.getElementById("run").value,
                nombre: document.getElementById("nombre").value,
                apellidos: document.getElementById("apellidos").value,
                correo: document.getElementById("correo").value,
                password: document.getElementById("password").value,
                tipoUsuario: document.getElementById("tipoUsuario").value,
                direccion: document.getElementById("direccion").value
            };

            const errores = validarRegistro(datos);
            const divErrores = document.getElementById("errores-registro");

            if (errores.length > 0) {
                divErrores.innerHTML = errores.join("<br>");
            } else {
                divErrores.innerHTML = "";
                alert("¡Registro exitoso !");
                window.location.href = "login.html";
            }
        });
    </script>
</body>
</html>
