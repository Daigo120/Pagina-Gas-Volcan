<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gas El Volcán - Catálogo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand fw-bold text-warning" href="index.html">🌋 Gas El Volcán</a>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link active" href="catalogo.html">Catálogo</a></li>
                        <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-5">
        <h2 class="fw-bold mb-4">Catálogo de Productos y Soluciones de Gas</h2>
        <div class="row">
            <!-- Columna de Productos -->
            <div class="col-lg-8">
                <div class="row" id="contenedor-productos">
                    <!-- Los productos se cargan dinámicamente con JavaScript -->
                </div>
            </div>

            <!-- Columna de Carrito de Compras -->
            <div class="col-lg-4">
                <div class="card shadow-sm sticky-top" style="top: 20px;">
                    <div class="card-header bg-dark text-white fw-bold">
                        🛒 Mi Carrito de Compras
                    </div>
                    <div class="card-body">
                        <ul class="list-group mb-3" id="lista-carrito">
                            <!-- Items agregados en JS -->
                        </ul>
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <span class="fs-5">Total:</span>
                            <span class="fs-4 fw-bold text-success" id="total-carrito">$0</span>
                        </div>
                        <button class="btn btn-success w-100 fw-bold">Finalizar Pedido</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="text-white text-center py-4 mt-auto">
        <p class="mb-0">&copy; 2026 Distribuidora de Gas El Volcán</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/datos.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
