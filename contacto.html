<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gas El Volcán - Contacto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand fw-bold text-warning" href="index.html">🌋 Gas El Volcán</a>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link active" href="contacto.html">Contacto</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h3 class="fw-bold mb-4">Contáctanos</h3>
                        <form id="form-contacto">
                            <div class="mb-3">
                                <label class="form-label">Nombre Completo</label>
                                <input type="text" id="nombreContacto" class="form-control">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Correo Electrónico</label>
                                <input type="email" id="correoContacto" class="form-control">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Comentario o Mensaje</label>
                                <textarea id="comentarioContacto" class="form-control" rows="4"></textarea>
                            </div>
                            <div id="errores-contacto" class="error-message mb-3"></div>
                            <button type="submit" class="btn btn-warning w-100 fw-bold">Enviar Consulta</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="text-white text-center py-4 mt-auto">
        <p class="mb-0">&copy; 2026 Distribuidora de Gas El Volcán</p>
    </footer>

    <script src="js/validaciones.js"></script>
    <script>
        document.getElementById("form-contacto").addEventListener("submit", function(e) {
            e.preventDefault();
            const nom = document.getElementById("nombreContacto").value;
            const mail = document.getElementById("correoContacto").value;
            const com = document.getElementById("comentarioContacto").value;

            const errores = validarContacto(nom, mail, com);
            const div = document.getElementById("errores-contacto");

            if(errores.length > 0) {
                div.innerHTML = errores.join("<br>");
            } else {
                div.innerHTML = "";
                alert("¡Mensaje enviado correctamente!");
                this.reset();
            }
        });
    </script>
</body>
</html>
